<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Synapsys">
<meta name="theme-color" content="#0d1320">
<meta name="description" content="Inteligência comportamental DISC aplicada">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="shortcut icon" href="/icons/icon-192.png">
<title>SynapsysAI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0a0f1a;
  --sidebar-bg:#0d1320;
  --surface:#111827;
  --surface2:#1a2332;
  --border:rgba(255,255,255,0.07);
  --border-active:rgba(80,200,255,0.3);
  --blue:#50c8ff;
  --blue-dim:rgba(80,200,255,0.6);
  --green:#30f0c0;
  --text:#e8f4ff;
  --text-dim:rgba(180,220,255,0.6);
  --text-faint:rgba(120,170,210,0.35);
  --user-bubble:#1a3a5c;
  --ai-bubble:#111827;
  --radius:12px;
}
body{background:var(--bg);font-family:'SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;height:100vh;overflow:hidden;display:flex;color:var(--text);}

/* ── SIDEBAR ── */
.sidebar{width:260px;flex-shrink:0;background:var(--sidebar-bg);border-right:0.5px solid var(--border);display:flex;flex-direction:column;height:100vh;}

.sidebar-top{padding:16px 12px 8px;}
.sidebar-logo{display:flex;align-items:center;gap:8px;padding:6px 8px;margin-bottom:8px;}
.logo-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px rgba(48,240,192,0.6);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.logo-text{font-size:12px;font-weight:600;letter-spacing:.12em;color:rgba(80,200,255,0.7);}

.new-chat-btn{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius);border:0.5px solid var(--border-active);background:rgba(80,200,255,0.05);color:var(--blue);font-size:13px;cursor:pointer;font-family:inherit;transition:all .15s;}
.new-chat-btn:hover{background:rgba(80,200,255,0.1);}
.new-chat-btn svg{opacity:.7;}

.sidebar-section{padding:16px 12px 4px;}
.sidebar-label{font-size:10px;letter-spacing:.1em;color:var(--text-faint);text-transform:uppercase;padding:0 8px;margin-bottom:4px;}

.conv-list{flex:1;overflow-y:auto;padding:0 12px 8px;scrollbar-width:thin;scrollbar-color:rgba(80,200,255,0.08) transparent;}
.conv-list::-webkit-scrollbar{width:3px;}
.conv-list::-webkit-scrollbar-thumb{background:rgba(80,200,255,0.1);border-radius:2px;}

.conv-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;cursor:pointer;border:0.5px solid transparent;transition:all .12s;margin-bottom:2px;}
.conv-item:hover{background:rgba(80,200,255,0.06);border-color:var(--border);}
.conv-item.active{background:rgba(80,200,255,0.1);border-color:rgba(80,200,255,0.2);}
.conv-title{font-size:12px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
.conv-item.active .conv-title{color:var(--text);}
.conv-date{font-size:10px;color:var(--text-faint);flex-shrink:0;}

.conv-empty{padding:16px 10px;font-size:12px;color:var(--text-faint);line-height:1.6;text-align:center;}

.sidebar-footer{border-top:0.5px solid var(--border);padding:10px 12px;}
.user-btn{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;border:0.5px solid transparent;background:none;cursor:pointer;transition:all .12s;font-family:inherit;}
.user-btn:hover{background:rgba(80,200,255,0.06);border-color:var(--border);}
.user-avatar{width:30px;height:30px;border-radius:50%;background:rgba(26,80,160,0.5);border:0.5px solid rgba(80,200,255,0.3);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--blue);flex-shrink:0;}
.user-info{flex:1;text-align:left;}
.user-name{font-size:12px;color:var(--text-dim);}
.user-email{font-size:10px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px;}
.logout-icon{font-size:12px;color:var(--text-faint);}

/* user menu */
.user-menu{position:absolute;bottom:calc(100% + 6px);left:12px;right:12px;background:rgba(10,18,30,0.98);border:0.5px solid rgba(80,200,255,0.18);border-radius:12px;padding:6px;display:none;z-index:100;box-shadow:0 -8px 32px rgba(0,0,0,0.5);}
.user-menu.open{display:block;}
.um-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;font-size:12px;color:var(--text-dim);cursor:pointer;transition:background .12s;}
.um-item:hover{background:rgba(80,200,255,0.08);}
.um-item.danger{color:rgba(240,100,100,0.8);}
.um-item.danger:hover{background:rgba(200,50,50,0.1);}
.um-divider{height:0.5px;background:var(--border);margin:4px 0;}

/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden;}

/* Header */
.chat-header{padding:14px 24px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.chat-title{font-size:14px;font-weight:500;color:var(--text-dim);}
.header-actions{display:flex;gap:8px;}
.header-btn{background:none;border:0.5px solid var(--border);border-radius:8px;color:var(--text-faint);font-size:11px;padding:5px 12px;cursor:pointer;font-family:inherit;transition:all .12s;}
.header-btn:hover{border-color:rgba(80,200,255,0.25);color:var(--text-dim);}

/* Messages */
.messages-wrap{flex:1;overflow-y:auto;padding:24px 0;scrollbar-width:thin;scrollbar-color:rgba(80,200,255,0.08) transparent;}
.messages-wrap::-webkit-scrollbar{width:4px;}
.messages-wrap::-webkit-scrollbar-thumb{background:rgba(80,200,255,0.1);border-radius:2px;}
.messages-inner{max-width:720px;margin:0 auto;padding:0 24px;display:flex;flex-direction:column;gap:24px;}

/* Welcome screen */
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;gap:20px;}
.welcome-orb{width:56px;height:56px;border-radius:50%;background:rgba(26,80,160,0.2);border:0.5px solid rgba(80,200,255,0.3);display:flex;align-items:center;justify-content:center;margin:0 auto;}
.orb-dot{width:14px;height:14px;border-radius:50%;background:var(--blue);box-shadow:0 0 16px 4px rgba(80,200,255,0.4);animation:orb-pulse 2.5s infinite;}
@keyframes orb-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
.welcome h2{font-size:24px;font-weight:400;color:var(--text);letter-spacing:-.01em;}
.welcome p{font-size:14px;color:var(--text-dim);line-height:1.7;max-width:420px;}
.welcome-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:4px;}
.chip{padding:8px 16px;border-radius:999px;border:0.5px solid var(--border-active);background:rgba(80,200,255,0.05);color:var(--blue-dim);font-size:12px;cursor:pointer;transition:all .15s;font-family:inherit;}
.chip:hover{background:rgba(80,200,255,0.1);}

/* Message bubbles */
.msg{display:flex;gap:12px;align-items:flex-start;}
.msg.user{flex-direction:row-reverse;}
.msg-avatar{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;}
.msg.ai .msg-avatar{background:rgba(26,80,160,0.3);border:0.5px solid rgba(80,200,255,0.25);color:var(--blue);}
.msg.user .msg-avatar{background:rgba(13,158,120,0.25);border:0.5px solid rgba(48,240,192,0.2);color:var(--green);}
.msg-bubble{max-width:580px;padding:12px 16px;border-radius:var(--radius);font-size:14px;line-height:1.7;color:var(--text);}
.msg.ai .msg-bubble{background:var(--ai-bubble);border:0.5px solid var(--border);}
.msg.user .msg-bubble{background:var(--user-bubble);border:0.5px solid rgba(80,200,255,0.15);}
.msg-bubble pre{background:rgba(0,0,0,0.3);border:0.5px solid var(--border);border-radius:8px;padding:12px;overflow-x:auto;font-size:12px;margin:8px 0;}
.msg-bubble code{font-family:'SF Mono','Fira Code',monospace;font-size:12px;}
.msg-bubble p+p{margin-top:8px;}

/* Typing indicator */
.typing-bubble{display:flex;gap:4px;padding:12px 16px;background:var(--ai-bubble);border:0.5px solid var(--border);border-radius:var(--radius);width:fit-content;}
.typing-dot{width:6px;height:6px;border-radius:50%;background:var(--blue-dim);animation:tdot .9s infinite;}
.typing-dot:nth-child(2){animation-delay:.15s;}
.typing-dot:nth-child(3){animation-delay:.3s;}
@keyframes tdot{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

/* ── INPUT AREA ── */
.input-area{padding:16px 24px 20px;border-top:0.5px solid var(--border);flex-shrink:0;}
.input-wrap{max-width:720px;margin:0 auto;position:relative;}
.input-box{width:100%;background:var(--surface);border:0.5px solid rgba(80,200,255,0.2);border-radius:14px;padding:14px 52px 14px 16px;font-size:14px;color:var(--text);font-family:inherit;outline:none;resize:none;max-height:200px;min-height:52px;line-height:1.5;transition:border-color .15s;}
.input-box:focus{border-color:rgba(80,200,255,0.45);}
.input-box::placeholder{color:var(--text-faint);}
.send-btn{position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:9px;background:rgba(20,80,140,0.8);border:0.5px solid rgba(80,200,255,0.45);color:var(--blue);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.send-btn:hover{background:rgba(30,110,190,0.9);}
.send-btn:disabled{opacity:.3;cursor:default;}
.input-hint{text-align:center;font-size:11px;color:var(--text-faint);margin-top:8px;}

/* Scrollbar */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(80,200,255,0.1);border-radius:2px;}

/* ── MOBILE ── */
@media (max-width: 768px) {
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;z-index:200;
    transform:translateX(-100%);transition:transform .25s ease;
    width:80vw;max-width:300px;
  }
  .sidebar.open{transform:translateX(0);}
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:199;}
  .sidebar-overlay.open{display:block;}
  .main{width:100%;}
  .chat-header{padding:12px 16px;padding-top:max(12px, env(safe-area-inset-top));}
  .hamburger{display:flex;}
  .messages-inner{padding:0 16px;}
  .input-area{padding:10px 16px;padding-bottom:max(16px, env(safe-area-inset-bottom));}
  .input-box{font-size:16px;} /* prevents zoom on iOS */
  .msg-bubble{font-size:14px;}
  .welcome h2{font-size:20px;}
  .welcome-chips{flex-direction:column;align-items:stretch;}
  .chip{text-align:center;}
  .messages-wrap{
    padding-bottom: max(16px, env(safe-area-inset-bottom));
  }
}
@media (min-width: 769px) {
  .sidebar-overlay{display:none !important;}
  .hamburger{display:none !important;}
}
/* Hamburger button */
.hamburger{
  background:none;border:0.5px solid var(--border);border-radius:8px;
  color:var(--text-dim);padding:6px 10px;cursor:pointer;
  align-items:center;gap:6px;font-size:13px;
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-top">
    <div class="sidebar-logo">
      <div class="logo-dot"></div>
      <span class="logo-text">SYNAPSYS AI</span>
    </div>
    <button class="new-chat-btn" id="new-chat-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Nova conversa
    </button>
  </div>

  <div class="sidebar-section">
    <div class="sidebar-label">Recentes</div>
  </div>
  <div class="conv-list" id="conv-list">
    <div class="conv-empty">Entre para ver seu histórico</div>
  </div>

  <div class="sidebar-footer" style="position:relative;">
    <div class="user-menu" id="user-menu">
      <div class="um-item" id="um-plans">📋 Ver planos</div>
      <div class="um-divider"></div>
      <div class="um-item danger" id="um-logout">↪ Sair</div>
    </div>
    <button class="user-btn" id="user-btn">
      <div class="user-avatar" id="user-avatar">AI</div>
      <div class="user-info">
        <div class="user-name" id="user-name">Acessar conta</div>
        <div class="user-email" id="user-email">entre para salvar conversas</div>
      </div>
      <span class="logout-icon">⌃</span>
    </button>
  </div>
</aside>

<!-- MAIN -->
<main class="main">
  <div class="chat-header">
    <button class="hamburger" id="hamburger-btn">☰</button>
    <span class="chat-title" id="chat-title">Nova conversa</span>
    <div class="header-actions">
      <button class="header-btn" id="clear-btn">Limpar</button>
    </div>
  </div>

  <div class="messages-wrap" id="messages-wrap">
    <div class="messages-inner" id="messages-inner">
      <div class="welcome" id="welcome">
        <div class="welcome-orb"><div class="orb-dot"></div></div>
        <h2>Como posso ajudar?</h2>
        <p>Análise comportamental DISC, inteligência empresarial e muito mais.</p>
        <div class="welcome-chips">
          <button class="chip" data-q="Analise o perfil DI no contexto de liderança">Perfil DI em liderança</button>
          <button class="chip" data-q="Como comunicar mudanças para um perfil S?">Comunicar para perfil S</button>
          <button class="chip" data-q="Quais são os riscos de uma equipe com muitos perfis D?">Riscos de equipe D</button>
          <button class="chip" data-q="Como montar uma equipe DISC equilibrada?">Equipe equilibrada</button>
        </div>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-wrap">
      <textarea class="input-box" id="input-box" placeholder="Mensagem para Synapsys..." rows="1"></textarea>
      <button class="send-btn" id="send-btn" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
    <div class="input-hint">Shift+Enter para nova linha</div>
  </div>
</main>

<script src="/synapsys_v6.js"></script>

<script>
// Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}

// Hamburger / sidebar toggle
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('sidebar-overlay');
const hamburger = document.getElementById('hamburger-btn');

function openSidebar() { sidebar.classList.add('open'); overlay.classList.add('open'); }
function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('open'); }

hamburger?.addEventListener('click', openSidebar);
overlay?.addEventListener('click', closeSidebar);

// Close sidebar on conv click (mobile)
document.getElementById('conv-list')?.addEventListener('click', () => {
  if (window.innerWidth <= 768) closeSidebar();
});
document.getElementById('new-chat-btn')?.addEventListener('click', () => {
  if (window.innerWidth <= 768) closeSidebar();
});

// PWA Install prompt
let deferredPrompt;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  // Show install button if exists
  const btn = document.getElementById('install-btn');
  if (btn) btn.style.display = 'flex';
});
</script>
</body>
</html>
